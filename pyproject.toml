[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fixtureforge"
version = "0.1.0"
description = "Deterministic JSON fixtures from a limited JSON Schema subset"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
fixtureforge = "fixtureforge.__main__:main"

[tool.setuptools.packages.find]
include = ["fixtureforge*"]
